<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title">
  <title id="title">Sistema de Riego · Simulación con lógica difusa y optimización genética</title>
  <style>
.droplet { animation: water-drop 1.25s cubic-bezier(.16,.7,.24,1) both; }

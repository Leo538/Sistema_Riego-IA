    <linearGradient id="title-color" x2="1" y2=".81"><stop stop-color="#effff2"/><stop offset=".46" stop-color="#a3edeb"/><stop offset="1" stop-color="#8cd1fc"/></linearGradient>
    <radialGradient id="shine" cx=".8" cy=".56" r=".57"><stop stop-color="#94ebde" stop-opacity=".16"/><stop offset="1" stop-color="#94ebde" stop-opacity="0"/></radialGradient>
    <clipPath id="outline"><rect x="1" y="1" width="898" height="238" rx="21"/></clipPath>

    @keyframes water-drop { from { transform: translateY(-17px); opacity: .65; } to { transform: translateY(0); opacity: 1; } }
    @keyframes spread { from { transform: scale(.58); opacity: .2; } to { transform: scale(1); opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#133544"/><stop offset=".53" stop-color="#112b38"/><stop offset="1" stop-color="#122232"/></linearGradient>

    <rect width="900" height="240" fill="url(#shine)"/>

    <defs>
      <linearGradient id="water" x2=".9" y2="1"><stop stop-color="#b6fff0"/><stop offset=".59" stop-color="#55cdc5"/><stop offset="1" stop-color="#2a88b3"/></linearGradient>
    </defs>
    <g fill="none" stroke="#75dacb" stroke-opacity=".24" stroke-width="1.5">
      <path d="M-16 207c83-51 168-17 259-19 110-2 202-39 334-13s238 41 334-15"/>
      <path d="M-10 226c91-44 177-20 271-23 118-3 173-32 315-9 145 23 240 38 326-19"/>
      <path d="M43 244c72-31 161-22 243-23 126-2 198-20 304-7 115 15 222 30 312-17"/>
    </g>
    <g class="ripples" fill="none" stroke="#a4f7e4">
